name: Probar DirecTV Uruguay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar la página
        run: |
          {
            echo "== pagina"
            curl -sS -L -m 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" -o p.html -w "%{http_code} %{size_download}\n" "https://www.directv.com.uy/guia/guia.aspx" || true
            head -c 400 p.html | tr -d '\r' | head -8
            echo "== api"
            curl -sS -L -m 60 -A "Mozilla/5.0" -o a.txt -w "%{http_code} %{size_download}\n" "https://www.directv.com.uy/guia/ChannelDetail.aspx/GetChannels" -X POST -H "Content-Type: application/json" -d '{}' || true
            head -c 300 a.txt
          } > guia/directv-info.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guia/directv-info.txt
          git commit -m "Resultado de prueba DirecTV" && git push || true
