name: Probar guía DirecTV Uruguay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y resumir
        run: |
          curl -sS -L -m 120 -o d.xml -w '%{http_code} %{size_download}\n' https://iptv-org.github.io/epg/guides/es/directv.com.uy.xml | tee guia/directv-info.txt
          python3 - <<'PY' | tee -a guia/directv-info.txt
          import re, html, collections
          x = open('d.xml', encoding='utf-8', errors='replace').read()
          names = dict((k, html.unescape(v)) for k, v in re.findall(r'<channel id="([^"]*)">\s*<display-name[^>]*>([^<]*)', x))
          prog = re.findall(r'<programme start="(\d+)[^"]*" stop="(\d+)[^"]*" channel="([^"]*)"', x)
          c = collections.Counter(p[2] for p in prog)
          print(len(names), 'canales', len(prog), 'programas')
          if prog:
              print('desde', min(p[0] for p in prog), 'hasta', max(p[1] for p in prog))
          for k, n in names.items():
              print(k, '|', n, '|', c.get(k, 0))
          PY
          rm -f d.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guia/directv-info.txt
          git commit -m "Resumen de la guía de DirecTV Uruguay" && git push || true
