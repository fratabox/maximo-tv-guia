name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request
          for u in ["https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard?dates=20261124-20261126","https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world.u17/scoreboard?dates=20261123-20261126&limit=100"]:
            j=json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=20))
            ev=j.get("events",[])
            print("RANGE",len(ev),[e["date"] for e in ev][:30])
          PY
